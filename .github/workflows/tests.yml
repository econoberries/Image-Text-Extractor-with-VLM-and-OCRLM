name: Offline code and experiment readiness
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU analysis and orchestrator
        run: |
          python -m pip install -r requirements/analysis-lock.txt
          python -m pip install -e .
          python -m pip check
      - name: Validate SLURM Bash syntax
        run: |
          bash -n slurm/check_environment.sbatch
          bash -n slurm/worker.sbatch
          bash -n slurm/collector.sbatch
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
      - name: Check bootstrap and finalizer commands
        run: |
          python scripts/bootstrap_kie.py --help
          python scripts/finalize_benchmark.py --help
      - name: Validate frozen full-run model configuration
        run: |
          python -c "from ulm_extractor.config import load_config; assert len(load_config('model.yml')) == 6"
